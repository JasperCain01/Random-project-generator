# Question archetype registry
#
# Archetypes are templates, not literal questions. At generation time the
# {dataset} placeholder is filled with the chosen dataset's name.
#
# Matching rules against a dataset's shape_tags:
#   requires_all  dataset must carry every listed tag
#   requires_any  dataset must carry at least one listed tag
# (both may be present; both must then be satisfied; an archetype with
#  neither field matches every dataset)
#
# family is a coarse label shown to the player (Trends, Multivariate, etc.)

- id: long-run-trend
  family: Trends
  requires_any: [time_series]
  template: >
    What is the long-run trend in {dataset}? Decompose it: how much is
    secular drift, how much is seasonal or cyclical, and how much is noise?

- id: changepoint
  family: Trends
  requires_any: [time_series]
  template: >
    Find the moment the story changed in {dataset}. Is there a structural
    break or regime change, and what real-world event coincides with it?

- id: forecast
  family: Forecasting
  requires_any: [time_series]
  template: >
    Build a forecast from {dataset} for the next few periods. Compare a naive
    baseline against a proper model — how much does the model actually buy you?

- id: convergence-divergence
  family: Trends
  requires_all: [panel, country_level]
  template: >
    Are countries in {dataset} converging or diverging over time? Quantify the
    gap between the top and bottom groups and how it has moved.

- id: pca-structure
  family: Dimensionality
  requires_any: [multivariate_numeric]
  template: >
    Run a PCA on {dataset}. What do the first two or three components mean in
    plain language, and which observations sit far from everyone else?

- id: clustering
  family: Dimensionality
  requires_any: [multivariate_numeric]
  template: >
    Cluster the observations in {dataset}. How many natural groups are there,
    do they match any existing labels, and what defines each group?

- id: anomaly-hunt
  family: Anomalies
  requires_any: [time_series, multivariate_numeric, transactions]
  template: >
    Hunt for anomalies in {dataset}. Define "unusual" quantitatively, flag the
    strangest observations, and investigate whether they are errors or stories.

- id: spatial-pattern
  family: Spatial
  requires_any: [geographic]
  template: >
    Map {dataset}. Is the spatial pattern clustered, dispersed, or random —
    and can you back that judgement with a statistic rather than a glance?

- id: choropleth-story
  family: Spatial
  requires_any: [geographic]
  template: >
    Build a choropleth (or point map) from {dataset} that tells one clear
    story, then write the three-sentence caption that a newspaper would print.

- id: network-centrality
  family: Networks
  requires_any: [network]
  template: >
    Treat {dataset} as a network. Who are the most central nodes, does the
    network have communities, and how has its structure shifted over time?

- id: league-table
  family: Comparison
  requires_any: [categorical, country_level]
  template: >
    Build a defensible ranking from {dataset}. Who is top, who is bottom, how
    sensitive is the ordering to your methodological choices?

- id: correlation-vs-causation
  family: Relationships
  requires_any: [panel, multivariate_numeric]
  template: >
    Pick two variables in {dataset} that correlate strongly. Argue both sides:
    what would the causal story be, and what confounder could explain it away?

- id: distribution-inequality
  family: Distributions
  requires_any: [individual_level, transactions, country_level]
  template: >
    Study the full distribution in {dataset}, not just the mean. How skewed or
    unequal is it (Gini, top-decile share), and is that concentration growing?

- id: simulation-uncertainty
  family: Simulation
  template: >
    Take one headline number you can compute from {dataset} and put honest
    uncertainty around it using bootstrap or permutation methods. Does the
    headline survive?

- id: missingness
  family: Data quality
  requires_any: [survey, panel, individual_level]
  template: >
    Profile the missing data in {dataset}. Is it missing at random? Who or
    what is systematically absent, and how would that bias a naive analysis?

- id: text-sentiment
  family: Text
  requires_any: [text]
  template: >
    Track sentiment and emotional language across {dataset} over time. When
    was the tone darkest, and does it track historical events?

- id: text-topics
  family: Text
  requires_any: [text]
  template: >
    Fit a topic model to {dataset}. What themes emerge, and how has their
    prominence risen and fallen across the corpus?

- id: seasonality
  family: Trends
  requires_any: [time_series]
  template: >
    Isolate the seasonal or weekly rhythm in {dataset}. What repeats, how
    strong is the cycle, and is the rhythm itself changing?

- id: cohort-comparison
  family: Comparison
  requires_any: [categorical, individual_level]
  template: >
    Split {dataset} into meaningful cohorts and compare them. Which difference
    between groups is largest, and does it hold up after controlling for an
    obvious confounder?

- id: relational-join-insight
  family: Relationships
  requires_any: [relational]
  template: >
    The interesting answer in {dataset} needs at least two of its tables.
    Find a question that only a join can answer, and answer it.

- id: lead-lag
  family: Relationships
  requires_any: [time_series]
  template: >
    Pick two related series in {dataset} (or split one by group). Does one
    lead the other? Use cross-correlation at different lags to find out.

- id: volatility-regimes
  family: Trends
  requires_any: [time_series]
  template: >
    Ignore the level of {dataset} and study its volatility instead. When was
    it calmest, when wildest, and does turbulence cluster in time?

- id: event-impact
  family: Trends
  requires_all: [events, time_series]
  template: >
    Choose one notable event in {dataset} and treat it as a natural
    experiment: compare before and after, against a sensible counterfactual.

- id: record-extremes
  family: Anomalies
  requires_any: [time_series]
  template: >
    Study the records in {dataset}: how extreme is the most extreme value,
    how often are records broken, and is the rate of record-breaking itself
    speeding up or slowing down?

- id: rank-mobility
  family: Comparison
  requires_all: [panel]
  template: >
    Build a league table from {dataset} at two points in time. Who climbed,
    who fell, and is the ordering becoming more frozen or more fluid?

- id: composition-shift
  family: Comparison
  requires_all: [categorical, time_series]
  template: >
    Look at shares, not totals, in {dataset}. How has the composition shifted
    over time, and which category's rise came at whose expense?

- id: simpsons-paradox
  family: Relationships
  requires_any: [categorical, individual_level]
  template: >
    Hunt for a Simpson's paradox in {dataset}: a relationship that weakens,
    vanishes or reverses once you split the data by the right grouping
    variable. If you find one, explain it; if not, show why it's safe.

- id: regression-drivers
  family: Relationships
  requires_any: [multivariate_numeric]
  template: >
    Pick an outcome variable in {dataset} and model it. Which predictors
    genuinely matter, how big are their effects in real-world units, and
    what does the model get badly wrong?

- id: classification
  family: Prediction
  requires_all: [multivariate_numeric, categorical]
  template: >
    Train a classifier on {dataset} to predict one of its categorical labels.
    How accurate can you get with honest cross-validation, and which features
    carry the signal?

- id: market-basket
  family: Patterns
  requires_any: [transactions]
  template: >
    Mine {dataset} for co-occurrence: which items, categories or behaviours
    appear together far more often than chance? Turn the strongest
    association rules into a plain-language insight.

- id: rfm-segmentation
  family: Patterns
  requires_any: [transactions]
  template: >
    Segment the customers in {dataset} by recency, frequency and monetary
    value. Profile each segment and say what you would do differently for
    the top and bottom ones.

- id: benford
  family: Data quality
  requires_any: [transactions, country_level, events]
  template: >
    Do the leading digits in {dataset} obey Benford's law? Test it, visualise
    the deviation, and explain what conformity — or non-conformity — actually
    implies here.

- id: network-asymmetry
  family: Networks
  requires_any: [network]
  template: >
    Study the imbalances in {dataset}: which flows or relationships are
    strongly one-directional, and what does the pattern of asymmetry reveal?

- id: text-complexity
  family: Text
  requires_any: [text]
  template: >
    Measure how the language in {dataset} has changed: sentence length,
    readability, vocabulary richness. Is it getting simpler — and when did
    the style shift most sharply?

- id: distinctive-words
  family: Text
  requires_any: [text]
  template: >
    Split {dataset} into eras or groups and find each one's signature
    vocabulary (tf-idf or log-odds). What do the distinctive words say about
    how concerns have changed?
