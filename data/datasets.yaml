# Dataset registry
#
# Each entry describes one publicly available dataset the generator can suggest.
# Fields:
#   id          unique slug
#   name        display name
#   description one or two sentences shown to the player
#   themes      list of theme slugs (see README for vocabulary)
#   shape_tags  data-shape tags used to match compatible question archetypes
#   size        small | medium | large (rough guide to rows/download)
#   access      how to get it into R
#     type      r_package | csv_url | api | kaggle | download
#     hint      one-line R snippet or instruction
#   url         landing page for the human
#   license     short licence note

- id: gapminder
  name: Gapminder — life expectancy, population & GDP
  description: >
    Country-level life expectancy, population and GDP per capita for 142
    countries, 1952-2007. The classic development dataset.
  themes: [health, economics, international-relations]
  shape_tags: [time_series, panel, multivariate_numeric, country_level]
  size: small
  access:
    type: r_package
    hint: "install.packages('gapminder'); library(gapminder)"
  url: https://cran.r-project.org/package=gapminder
  license: CC BY 4.0

- id: owid-life-expectancy
  name: Our World in Data — life expectancy
  description: >
    Long-run life expectancy at birth for every country, some series reaching
    back to the 1700s. Tidy CSV straight from the OWID grapher.
  themes: [health, international-relations]
  shape_tags: [time_series, panel, country_level]
  size: medium
  access:
    type: csv_url
    hint: "read.csv('https://ourworldindata.org/grapher/life-expectancy.csv?v=1&csvType=full')"
  url: https://ourworldindata.org/life-expectancy
  license: CC BY 4.0

- id: owid-covid
  name: Our World in Data — COVID-19 dataset
  description: >
    Daily cases, deaths, testing, hospitalisation and vaccination for every
    country over the whole pandemic. Large but tidy.
  themes: [health, politics, international-relations]
  shape_tags: [time_series, panel, country_level, large]
  size: large
  access:
    type: csv_url
    hint: "read.csv('https://covid.ourworldindata.org/data/owid-covid-data.csv')"
  url: https://github.com/owid/covid-19-data
  license: CC BY 4.0

- id: nhanes
  name: NHANES — US national health & nutrition survey
  description: >
    Individual-level body measurements, demographics, lifestyle and lab
    results from the CDC's national health examination survey.
  themes: [health]
  shape_tags: [multivariate_numeric, individual_level, survey, categorical]
  size: medium
  access:
    type: r_package
    hint: "install.packages('NHANES'); library(NHANES); data(NHANES)"
  url: https://cran.r-project.org/package=NHANES
  license: Public domain (CDC)

- id: cdc-causes-of-death
  name: CDC — leading causes of death in the US
  description: >
    Age-adjusted death rates for the ten leading causes of death, by US state
    and year, from the National Center for Health Statistics.
  themes: [health, politics]
  shape_tags: [time_series, categorical, geographic, panel]
  size: small
  access:
    type: csv_url
    hint: "read.csv('https://data.cdc.gov/api/views/bi63-dtpu/rows.csv?accessType=DOWNLOAD')"
  url: https://data.cdc.gov/NCHS/NCHS-Leading-Causes-of-Death-United-States/bi63-dtpu
  license: Public domain (US government)

- id: fred
  name: FRED — Federal Reserve economic data
  description: >
    Hundreds of thousands of US and international macroeconomic time series:
    rates, inflation, employment, money supply. Pick any series that catches
    your eye.
  themes: [finance, economics]
  shape_tags: [time_series]
  size: medium
  access:
    type: api
    hint: "install.packages('fredr'); fredr::fredr('UNRATE')  # free API key, or CSV export from the site"
  url: https://fred.stlouisfed.org
  license: Mostly public domain; per-series terms

- id: stock-prices
  name: Daily stock & index prices (Yahoo Finance)
  description: >
    Open/high/low/close/volume for any listed ticker or index, decades deep,
    one function call away.
  themes: [finance]
  shape_tags: [time_series, multivariate_numeric]
  size: medium
  access:
    type: r_package
    hint: "install.packages('tidyquant'); tidyquant::tq_get(c('AAPL','^GSPC'), from='2015-01-01')"
  url: https://business-science.github.io/tidyquant/
  license: Personal/research use (Yahoo terms)

- id: crypto-coingecko
  name: CoinGecko — cryptocurrency market histories
  description: >
    Price, market cap and volume histories for thousands of cryptocurrencies
    via a free, keyless JSON API.
  themes: [finance]
  shape_tags: [time_series]
  size: small
  access:
    type: api
    hint: "jsonlite::fromJSON('https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=usd&days=365')"
  url: https://www.coingecko.com/en/api
  license: Free tier, attribution required

# The World Bank's WDI catalogue spans very different subjects, so it appears
# as several themed entries — each with an example indicator that matches its
# theme, so a draw is always self-explanatory.

- id: wdi-health
  name: World Bank WDI — health indicators
  description: >
    The health slice of the World Development Indicators: life expectancy,
    infant and maternal mortality, immunisation coverage, health spending —
    for every country since 1960.
  themes: [health]
  shape_tags: [time_series, panel, country_level, multivariate_numeric]
  size: medium
  access:
    type: r_package
    hint: "install.packages('WDI'); WDI::WDI(indicator=c('SP.DYN.LE00.IN','SH.DYN.MORT'), start=1990)  # life expectancy, under-5 mortality"
  url: https://data.worldbank.org/topic/health
  license: CC BY 4.0

- id: wdi-economy
  name: World Bank WDI — economic indicators
  description: >
    The macroeconomic core of the World Development Indicators: GDP, growth,
    inflation, unemployment, poverty headcounts — every country since 1960.
  themes: [economics]
  shape_tags: [time_series, panel, country_level, multivariate_numeric]
  size: medium
  access:
    type: r_package
    hint: "install.packages('WDI'); WDI::WDI(indicator=c('NY.GDP.PCAP.KD','FP.CPI.TOTL.ZG'), start=1990)  # GDP per capita, inflation"
  url: https://data.worldbank.org/topic/economy-and-growth
  license: CC BY 4.0

- id: wdi-climate
  name: World Bank WDI — energy & emissions
  description: >
    Environment and energy indicators from the WDI: CO2 emissions per capita,
    renewable energy share, electricity access, forest area.
  themes: [environment, economics]
  shape_tags: [time_series, panel, country_level, multivariate_numeric]
  size: medium
  access:
    type: r_package
    hint: "install.packages('WDI'); WDI::WDI(indicator=c('EN.GHG.CO2.PC.CE.AR5','EG.FEC.RNEW.ZS'), start=1990)  # CO2 per capita, renewables share"
  url: https://data.worldbank.org/topic/environment
  license: CC BY 4.0

- id: wdi-aid-remittances
  name: World Bank WDI — aid & remittance flows
  description: >
    Money crossing borders: official development aid received, personal
    remittances, and foreign direct investment, by country and year.
  themes: [international-relations, economics]
  shape_tags: [time_series, panel, country_level, multivariate_numeric]
  size: medium
  access:
    type: r_package
    hint: "install.packages('WDI'); WDI::WDI(indicator=c('DT.ODA.ODAT.PC.ZS','BX.TRF.PWKR.DT.GD.ZS'), start=1990)  # aid per capita, remittances %GDP"
  url: https://data.worldbank.org/topic/aid-effectiveness
  license: CC BY 4.0

# Eurostat is likewise a catalogue, split into themed slices.

- id: eurostat-economy
  name: Eurostat — unemployment & inflation
  description: >
    Harmonised unemployment and inflation (HICP) series for EU countries and
    regions, monthly and annual, from the EU's statistical office.
  themes: [economics]
  shape_tags: [time_series, panel, geographic, country_level]
  size: medium
  access:
    type: r_package
    hint: "install.packages('eurostat'); eurostat::get_eurostat('une_rt_m')  # monthly unemployment rate"
  url: https://ec.europa.eu/eurostat/web/lfs
  license: CC BY 4.0

- id: eurostat-tourism
  name: Eurostat — tourism & accommodation
  description: >
    Nights spent at tourist accommodation across EU countries and regions —
    strong seasonality, COVID shock, north-south contrasts.
  themes: [commerce]
  shape_tags: [time_series, panel, geographic, country_level]
  size: medium
  access:
    type: r_package
    hint: "install.packages('eurostat'); eurostat::get_eurostat('tour_occ_nim')  # monthly nights spent"
  url: https://ec.europa.eu/eurostat/web/tourism
  license: CC BY 4.0

- id: eurostat-migration
  name: Eurostat — migration & asylum
  description: >
    Immigration, emigration and asylum applications by citizenship for EU
    countries — the data behind one of Europe's defining political debates.
  themes: [international-relations, politics]
  shape_tags: [time_series, panel, country_level, categorical]
  size: medium
  access:
    type: r_package
    hint: "install.packages('eurostat'); eurostat::get_eurostat('migr_asyappctza')  # annual asylum applications"
  url: https://ec.europa.eu/eurostat/web/migration-asylum
  license: CC BY 4.0

- id: online-retail-uci
  name: UCI — online retail transactions
  description: >
    Half a million real transactions from a UK online giftware retailer over
    two years: invoices, products, quantities, prices, customer country.
  themes: [commerce]
  shape_tags: [transactions, time_series, categorical, large]
  size: large
  access:
    type: download
    hint: "Download the xlsx from the UCI repository, then readxl::read_excel()"
  url: https://archive.ics.uci.edu/dataset/502/online+retail+ii
  license: CC BY 4.0

- id: olist-ecommerce
  name: Olist — Brazilian e-commerce orders
  description: >
    100k orders from a Brazilian marketplace: order items, payments, reviews,
    sellers and customer geolocation across eight relational tables.
  themes: [commerce]
  shape_tags: [transactions, categorical, geographic, relational, large]
  size: large
  access:
    type: kaggle
    hint: "Download from Kaggle (free account), then read the CSVs with readr"
  url: https://www.kaggle.com/datasets/olistbr/brazilian-ecommerce
  license: CC BY-NC-SA 4.0

- id: un-comtrade
  name: UN Comtrade — international trade flows
  description: >
    Bilateral imports and exports by commodity between all countries — the
    canonical who-sells-what-to-whom dataset.
  themes: [commerce, economics, international-relations]
  shape_tags: [network, country_level, panel, categorical]
  size: medium
  access:
    type: r_package
    hint: "install.packages('comtradr'); comtradr::ct_get_data(reporter='GB', partner='all')  # free API key"
  url: https://comtradeplus.un.org
  license: Free for research with registration

- id: unvotes
  name: UN General Assembly voting records
  description: >
    Every UN General Assembly roll-call vote since 1946: country, vote, and
    issue classification. Great for alignment and bloc analysis.
  themes: [politics, international-relations]
  shape_tags: [panel, categorical, country_level, network, time_series]
  size: medium
  access:
    type: r_package
    hint: "install.packages('unvotes'); library(unvotes)"
  url: https://cran.r-project.org/package=unvotes
  license: CC0 (Voeten et al.)

- id: mit-election-lab
  name: MIT Election Lab — US presidential returns by county
  description: >
    County-level US presidential election results 2000-2020, with party and
    candidate vote counts.
  themes: [politics]
  shape_tags: [geographic, categorical, panel]
  size: medium
  access:
    type: download
    hint: "Download CSV from the Harvard Dataverse, then readr::read_csv()"
  url: https://electionlab.mit.edu/data
  license: CC0

- id: vdem
  name: V-Dem — Varieties of Democracy indices
  description: >
    450+ expert-coded indicators of democracy (elections, civil liberties,
    media freedom) for nearly every country back to 1789.
  themes: [politics, international-relations]
  shape_tags: [panel, multivariate_numeric, time_series, country_level]
  size: large
  access:
    type: r_package
    hint: "remotes::install_github('vdeminstitute/vdemdata'); library(vdemdata)"
  url: https://v-dem.net
  license: Free for research, cite V-Dem

- id: ucdp-conflict
  name: UCDP/PRIO — armed conflict dataset
  description: >
    Every armed conflict since 1946 with parties, location, intensity and
    year — the standard academic conflict dataset.
  themes: [international-relations, politics]
  shape_tags: [events, time_series, geographic, categorical]
  size: small
  access:
    type: download
    hint: "Download CSV from ucdp.uu.se/downloads, then readr::read_csv()"
  url: https://ucdp.uu.se/downloads/
  license: Free with citation

- id: unhcr-refugees
  name: UNHCR — refugee population statistics
  description: >
    Refugees, asylum seekers and internally displaced people by origin and
    asylum country, yearly since 1951, via UNHCR's own R package.
  themes: [international-relations, politics]
  shape_tags: [panel, time_series, country_level, network]
  size: medium
  access:
    type: r_package
    hint: "install.packages('refugees'); library(refugees); refugees::population"
  url: https://www.unhcr.org/refugee-statistics/
  license: CC BY 4.0

- id: nasa-gistemp
  name: NASA GISTEMP — global temperature anomalies
  description: >
    Monthly global and zonal surface temperature anomalies since 1880,
    maintained by NASA GISS.
  themes: [environment]
  shape_tags: [time_series]
  size: small
  access:
    type: csv_url
    hint: "read.csv('https://data.giss.nasa.gov/gistemp/tabledata_v4/GLB.Ts+dSST.csv', skip=1)"
  url: https://data.giss.nasa.gov/gistemp/
  license: Public domain (NASA)

- id: global-power-plants
  name: WRI — global power plant database
  description: >
    ~35,000 power plants worldwide with location, fuel type, capacity and
    estimated generation.
  themes: [environment, economics]
  shape_tags: [geographic, categorical, cross_section]
  size: medium
  access:
    type: download
    hint: "Download CSV from WRI / datasets.wri.org, then readr::read_csv()"
  url: https://datasets.wri.org/dataset/globalpowerplantdatabase
  license: CC BY 4.0

- id: palmerpenguins
  name: Palmer Station penguins
  description: >
    Body measurements for 344 penguins of three species from the Palmer
    Archipelago, Antarctica. The friendlier iris.
  themes: [science, environment]
  shape_tags: [multivariate_numeric, categorical, cross_section, individual_level]
  size: small
  access:
    type: r_package
    hint: "install.packages('palmerpenguins'); library(palmerpenguins)"
  url: https://allisonhorst.github.io/palmerpenguins/
  license: CC0

- id: nycflights13
  name: nycflights13 — every flight out of NYC in 2013
  description: >
    336,776 flights from the three New York airports with delays, carriers,
    weather and plane metadata in five relational tables.
  themes: [transport, commerce]
  shape_tags: [time_series, categorical, relational, network, large, events]
  size: large
  access:
    type: r_package
    hint: "install.packages('nycflights13'); library(nycflights13)"
  url: https://cran.r-project.org/package=nycflights13
  license: CC0

- id: sotu-speeches
  name: State of the Union addresses (full text)
  description: >
    The complete text of every US State of the Union address since 1790 —
    two centuries of political language in one package.
  themes: [politics, culture]
  shape_tags: [text, time_series]
  size: small
  access:
    type: r_package
    hint: "install.packages('sotu'); library(sotu); sotu_text"
  url: https://cran.r-project.org/package=sotu
  license: CC0

- id: spotify-songs
  name: Spotify songs — audio features of 30k tracks
  description: >
    Danceability, energy, valence, tempo and popularity for ~30,000 songs
    across six genres (TidyTuesday, sourced from the Spotify API).
  themes: [culture, commerce]
  shape_tags: [multivariate_numeric, categorical, cross_section]
  size: medium
  access:
    type: csv_url
    hint: "read.csv('https://raw.githubusercontent.com/rfordatascience/tidytuesday/master/data/2020/2020-01-21/spotify_songs.csv')"
  url: https://github.com/rfordatascience/tidytuesday/blob/master/data/2020/2020-01-21/readme.md
  license: CC0 (TidyTuesday)

- id: international-football
  name: International football results, 1872-present
  description: >
    Every men's international football match since 1872: teams, score,
    tournament, venue. 47k+ matches, updated continuously.
  themes: [sport, culture, international-relations]
  shape_tags: [time_series, events, categorical, network]
  size: medium
  access:
    type: csv_url
    hint: "read.csv('https://raw.githubusercontent.com/martj42/international_results/master/results.csv')"
  url: https://github.com/martj42/international_results
  license: CC0

# The lucky dip could land on any subject, so it does not claim real themes —
# it has its own "surprise-me" chip and otherwise only appears when no theme
# filter is active.
- id: tidytuesday-lucky-dip
  name: TidyTuesday lucky dip
  description: >
    Let fate go one level deeper: pick a random week from the TidyTuesday
    archive of 300+ curated, pre-cleaned datasets and use whatever you get.
  themes: [surprise-me]
  shape_tags: [time_series, categorical, multivariate_numeric, cross_section]
  size: small
  access:
    type: r_package
    hint: "install.packages('tidytuesdayR'); tidytuesdayR::tt_load(sample(2019:2024,1), week=sample(1:52,1))"
  url: https://github.com/rfordatascience/tidytuesday
  license: Varies by week (documented per dataset)
